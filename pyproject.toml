[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "coral-agent-chain"
version = "1.7.1"
description = "Reviewer implementation of the CorAL corrosion inhibitor discovery workflow"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi==0.115.6",
  "uvicorn==0.34.0",
  "pydantic==2.10.5",
  "pydantic-settings==2.7.1",
  "httpx==0.28.1",
  "pypdf==5.1.0",
  "numpy==2.2.1",
  "scipy==1.15.3",
  "scikit-learn==1.6.0",
  "joblib==1.6.0",
  "rdkit==2025.9.6",
  "shap==0.49.1",
  "pandas==2.2.3",
  "matplotlib==3.10.8",
]

[project.optional-dependencies]
dev = ["pytest==8.3.4"]

[tool.setuptools.packages.find]
include = ["coral", "coral.*"]

[tool.setuptools.package-data]
coral = ["data/*.csv", "data/*.json"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
